# The crates `crates.rs` analyzes, at the versions its tests expect. `cargo fetch` on this
# manifest puts their sources in the local cargo registry.
[package]
name = "crates-under-test"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
path = "lib.rs"

[workspace]

[dependencies]
aho-corasick = { version = "=1.1.5", default-features = false }
allocator-api2 = { version = "=0.2.21", default-features = false }
anes = { version = "=0.1.6", default-features = false }
