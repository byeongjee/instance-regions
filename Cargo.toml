[package]
name = "instance-regions"
version = "0.0.0"
edition = "2024"
description = "region constraints of the MIR of a monomorphized instance"
license = "MIT OR Apache-2.0"

[dependencies]
preborrowck-mir = { git = "https://github.com/byeongjee/preborrowck-mir.git", rev = "bae794c6437b63a562dc4d86a35c46d4846e5e82" }
rustc_utils = "=0.15.0-nightly-2026-05-01"

[dev-dependencies]
preborrowck-mir = { git = "https://github.com/byeongjee/preborrowck-mir.git", rev = "bae794c6437b63a562dc4d86a35c46d4846e5e82", features = ["test"] }

[package.metadata.rust-analyzer]
rustc_private = true

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"

[profile.dev]
opt-level = 1
